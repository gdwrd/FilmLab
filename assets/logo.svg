<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A1D" />
      <stop offset="50%" stop-color="#111214" />
      <stop offset="100%" stop-color="#0B0C0D" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB833" />
      <stop offset="100%" stop-color="#D98800" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#E04434" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#CFD4DC" />
      <stop offset="100%" stop-color="#7A808A" />
    </linearGradient>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB833" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#FF453A" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="102" fill="none" stroke="#2B2F36" stroke-width="3" />

  <!-- Outer Film Perforation strip border (left and right) -->
  <g fill="#1F2227">
    <!-- Left Sprocket Holes -->
    <rect x="24" y="60" width="18" height="26" rx="4" />
    <rect x="24" y="110" width="18" height="26" rx="4" />
    <rect x="24" y="160" width="18" height="26" rx="4" />
    <rect x="24" y="210" width="18" height="26" rx="4" />
    <rect x="24" y="260" width="18" height="26" rx="4" />
    <rect x="24" y="310" width="18" height="26" rx="4" />
    <rect x="24" y="360" width="18" height="26" rx="4" />
    <rect x="24" y="410" width="18" height="26" rx="4" />

    <!-- Right Sprocket Holes -->
    <rect x="470" y="60" width="18" height="26" rx="4" />
    <rect x="470" y="110" width="18" height="26" rx="4" />
    <rect x="470" y="160" width="18" height="26" rx="4" />
    <rect x="470" y="210" width="18" height="26" rx="4" />
    <rect x="470" y="260" width="18" height="26" rx="4" />
    <rect x="470" y="310" width="18" height="26" rx="4" />
    <rect x="470" y="360" width="18" height="26" rx="4" />
    <rect x="470" y="410" width="18" height="26" rx="4" />
  </g>

  <!-- Inner Amber Glow -->
  <circle cx="256" cy="228" r="160" fill="url(#lensGlow)" />

  <!-- Main Camera Aperture / Lens Circle -->
  <g filter="url(#shadow)">
    <!-- Lens Outer Barrel -->
    <circle cx="256" cy="228" r="132" fill="#1A1C20" stroke="#363B44" stroke-width="6" />
    <!-- Distance Scale Tick Ring -->
    <circle cx="256" cy="228" r="118" fill="none" stroke="#25282E" stroke-width="2" stroke-dasharray="4,8" />
    <!-- Kodachrome / CineStill Accent Color Ring -->
    <circle cx="256" cy="228" r="110" fill="none" stroke="url(#amberGrad)" stroke-width="3" />
    <!-- Lens Element Deep Well -->
    <circle cx="256" cy="228" r="102" fill="#0E0F12" />

    <!-- Aperture Blades (6 Interlocking Polygon Blades) -->
    <g fill="#1B1E24" stroke="#2D323A" stroke-width="1.5">
      <path d="M 256,138 L 310,180 L 268,206 Z" />
      <path d="M 334,183 L 346,248 L 296,242 Z" />
      <path d="M 334,273 L 292,318 L 274,270 Z" />
      <path d="M 256,318 L 202,276 L 244,250 Z" />
      <path d="M 178,273 L 166,208 L 216,214 Z" />
      <path d="M 178,183 L 220,138 L 238,186 Z" />
    </g>

    <!-- Aperture Opening (Center Optical Glass) -->
    <polygon points="256,178 296,201 296,247 256,270 216,247 216,201" fill="#08090B" stroke="url(#amberGrad)" stroke-width="2" />

    <!-- Glass Reflection Highlights -->
    <ellipse cx="236" cy="208" rx="28" ry="12" transform="rotate(-35 236 208)" fill="url(#silverGrad)" opacity="0.3" />
    <circle cx="268" cy="242" r="5" fill="#FFE082" opacity="0.6" />
  </g>

  <!-- Vintage Film Canister Brand Stripes (under lens) -->
  <g transform="translate(100, 376)">
    <!-- Kodak Amber Band -->
    <rect x="0" y="0" width="312" height="6" rx="3" fill="url(#amberGrad)" />
    <!-- CineStill Vermilion Accent -->
    <rect x="0" y="10" width="84" height="4" rx="2" fill="url(#redGrad)" />
    <!-- Velvia Emerald Accent -->
    <rect x="94" y="10" width="56" height="4" rx="2" fill="#2ECC71" />
    <!-- Fuji Mint Accent -->
    <rect x="160" y="10" width="56" height="4" rx="2" fill="#6DE0B8" />
    <!-- Ilford Silver Accent -->
    <rect x="226" y="10" width="86" height="4" rx="2" fill="url(#silverGrad)" />
  </g>

  <!-- Typography: App Name & Subtitle -->
  <text x="256" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, monospace" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="7">FILMLAB</text>
  <text x="256" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, monospace" font-size="12" font-weight="700" fill="#FFB833" text-anchor="middle" letter-spacing="3">35MM ANALOG EMULSION LAB</text>
</svg>
