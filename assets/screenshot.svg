<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1340" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121316" />
      <stop offset="100%" stop-color="#0A0B0D" />
    </linearGradient>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#224259" />
      <stop offset="35%" stop-color="#7B4B38" />
      <stop offset="70%" stop-color="#D98800" />
      <stop offset="100%" stop-color="#FFC145" />
    </linearGradient>
    <linearGradient id="cardGradSelected" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2315" />
      <stop offset="100%" stop-color="#1A150D" />
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#FFB833" flood-opacity="0.25" />
    </filter>
    <filter id="dockShadow" x="0%" y="-10%" width="100%" height="120%">
      <feDropShadow dx="0" dy="-8" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Device Frame Outer Shadow & Body -->
  <rect x="40" y="20" width="720" height="1300" rx="44" fill="#0E1012" stroke="#252932" stroke-width="4" />
  <rect x="52" y="32" width="696" height="1276" rx="36" fill="url(#phoneBg)" />

  <!-- Status Bar (Android Header) -->
  <g fill="#A0A5AE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">
    <text x="84" y="68">9:41</text>
    <g transform="translate(640, 56)" fill="#A0A5AE">
      <!-- Wi-Fi & Battery -->
      <path d="M12 4C7.58 4 3.6 5.8 0.77 8.7L12 21 23.23 8.7C20.4 5.8 16.42 4 12 4z" transform="scale(0.7) translate(-10, -2)" />
      <rect x="48" y="1" width="22" height="12" rx="3" fill="none" stroke="#A0A5AE" stroke-width="1.5" />
      <rect x="50" y="3" width="16" height="8" rx="1.5" fill="#A0A5AE" />
      <rect x="71" y="4" width="2" height="6" rx="1" fill="#A0A5AE" />
    </g>
  </g>

  <!-- Top Bar -->
  <g transform="translate(52, 90)">
    <!-- Amber Brand Indicator -->
    <circle cx="36" cy="24" r="5" fill="#FFB833" />
    <text x="50" y="25" fill="#FFFFFF" font-family="monospace" font-size="20" font-weight="900" letter-spacing="2">FILMLAB</text>
    <rect x="156" y="14" width="58" height="18" rx="4" fill="#252118" stroke="#54411D" stroke-width="1" />
    <text x="185" y="27" fill="#FFB833" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">35MM</text>

    <!-- Posture Badge -->
    <rect x="224" y="14" width="94" height="18" rx="4" fill="#1C2128" stroke="#333A46" stroke-width="1" />
    <text x="271" y="27" fill="#7DCD85" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">FOLD-AWARE</text>

    <!-- Top Right Actions: Info Button & Save Button -->
    <circle cx="560" cy="23" r="17" fill="#1B1E24" stroke="#2C313C" stroke-width="1" />
    <text x="560" y="28" fill="#A0A5AE" font-family="serif" font-size="15" font-weight="bold" text-anchor="middle">i</text>

    <!-- Save Button -->
    <rect x="590" y="6" width="76" height="34" rx="8" fill="#FFB833" />
    <text x="628" y="28" fill="#121316" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">SAVE</text>
  </g>

  <!-- Main Darkroom 35mm Viewport -->
  <g transform="translate(84, 154)">
    <!-- Photo Frame Card with Film Border -->
    <rect x="0" y="0" width="632" height="520" rx="16" fill="#16181D" stroke="#2D323E" stroke-width="1.5" />

    <!-- Simulated Kodachrome 35mm Master Photograph -->
    <g clip-path="url(#photoClip)">
      <clipPath id="photoClip">
        <rect x="6" y="6" width="620" height="508" rx="12" />
      </clipPath>
      <rect x="6" y="6" width="620" height="508" fill="url(#photoGrad)" />
      <!-- Sun Disk -->
      <circle cx="480" cy="220" r="54" fill="#FFEAA7" opacity="0.9" />
      <!-- Silhouetted Coastal Headland / Waves -->
      <path d="M 6 360 Q 180 320 340 370 T 626 340 L 626 514 L 6 514 Z" fill="#2E1C0F" opacity="0.9" />
      <path d="M 6 410 Q 220 380 440 430 T 626 390 L 626 514 L 6 514 Z" fill="#170F08" />
      <!-- Warm dye cloud grain pattern overlay -->
      <rect x="6" y="6" width="620" height="508" fill="#FFB833" opacity="0.08" />
    </g>

    <!-- 35mm Emulsion Info Tag (Top Left of Viewport) -->
    <rect x="18" y="18" width="220" height="26" rx="6" fill="#0C0E11" fill-opacity="0.85" stroke="#333842" stroke-width="1" />
    <circle cx="32" cy="31" r="4" fill="#FFB833" />
    <text x="44" y="35" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">K-64 • 2048px SCAN</text>

    <!-- Hold to Compare Pill (Bottom Center) -->
    <rect x="236" y="470" width="160" height="28" rx="14" fill="#0C0E11" fill-opacity="0.88" stroke="#FFB833" stroke-width="1" />
    <text x="316" y="488" fill="#FFB833" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">HOLD TO COMPARE</text>
  </g>

  <!-- Film Control Dock Area -->
  <g transform="translate(52, 696)" filter="url(#dockShadow)">
    <!-- Dock Background -->
    <rect x="0" y="0" width="696" height="576" rx="28" fill="#14161A" stroke="#252932" stroke-width="1" />

    <!-- Section Header: Film Stock Emulsion Selector -->
    <g transform="translate(32, 28)">
      <text x="0" y="16" fill="#E4E7EB" font-family="sans-serif" font-size="14" font-weight="800" letter-spacing="1">FILM STOCK EMULSIONS</text>
      <text x="0" y="32" fill="#8C93A0" font-family="monospace" font-size="11">Calibrated chemistry &amp; H-D sensitometry</text>
    </g>

    <!-- Film Preset Carousel Cards (Horizontal Scroll View) -->
    <g transform="translate(32, 74)">
      <!-- Card 1: Kodachrome 64 (SELECTED) -->
      <g filter="url(#cardGlow)">
        <rect x="0" y="0" width="144" height="154" rx="14" fill="url(#cardGradSelected)" stroke="#FFB833" stroke-width="2" />
        <rect x="12" y="12" width="46" height="20" rx="4" fill="#FFB833" />
        <text x="35" y="26" fill="#121316" font-family="monospace" font-size="11" font-weight="900" text-anchor="middle">K-64</text>
        <text x="12" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="800">Kodachrome</text>
        <text x="12" y="74" fill="#FFB833" font-family="sans-serif" font-size="11" font-weight="600">64 Reversal</text>
        <text x="12" y="104" fill="#A89476" font-family="monospace" font-size="9">ISO 64 • K-14</text>
        <text x="12" y="120" fill="#E5AA42" font-family="monospace" font-size="8">Dye Coupling</text>
        <circle cx="126" cy="22" r="4" fill="#FFB833" />
      </g>

      <!-- Card 2: Kodak Portra 400 -->
      <g transform="translate(156, 0)">
        <rect x="0" y="0" width="144" height="154" rx="14" fill="#1C1819" stroke="#3D2E30" stroke-width="1" />
        <rect x="12" y="12" width="46" height="20" rx="4" fill="#FF9A76" />
        <text x="35" y="26" fill="#121316" font-family="monospace" font-size="11" font-weight="900" text-anchor="middle">P-400</text>
        <text x="12" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="800">Portra 400</text>
        <text x="12" y="74" fill="#FF9A76" font-family="sans-serif" font-size="11" font-weight="600">Pastel Negative</text>
        <text x="12" y="104" fill="#8E8585" font-family="monospace" font-size="9">ISO 400 • C-41</text>
        <text x="12" y="120" fill="#B58679" font-family="monospace" font-size="8">T-Grain Micro</text>
      </g>

      <!-- Card 3: Fuji Velvia 50 -->
      <g transform="translate(312, 0)">
        <rect x="0" y="0" width="144" height="154" rx="14" fill="#132720" stroke="#1B5542" stroke-width="1" />
        <rect x="12" y="12" width="56" height="20" rx="4" fill="#2ECC71" />
        <text x="40" y="26" fill="#121316" font-family="monospace" font-size="11" font-weight="900" text-anchor="middle">RVP-50</text>
        <text x="12" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="800">Velvia 50</text>
        <text x="12" y="74" fill="#2ECC71" font-family="sans-serif" font-size="11" font-weight="600">Vivid Chrome</text>
        <text x="12" y="104" fill="#759A8D" font-family="monospace" font-size="9">ISO 50 • E-6</text>
        <text x="12" y="120" fill="#3AA874" font-family="monospace" font-size="8">Deep Saturation</text>
      </g>

      <!-- Card 4: CineStill 800T -->
      <g transform="translate(468, 0)">
        <rect x="0" y="0" width="144" height="154" rx="14" fill="#2B1817" stroke="#5E2422" stroke-width="1" />
        <rect x="12" y="12" width="46" height="20" rx="4" fill="#FF453A" />
        <text x="35" y="26" fill="#121316" font-family="monospace" font-size="11" font-weight="900" text-anchor="middle">800T</text>
        <text x="12" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="800">CineStill</text>
        <text x="12" y="74" fill="#FF453A" font-family="sans-serif" font-size="11" font-weight="600">Tungsten Halation</text>
        <text x="12" y="104" fill="#A57E7C" font-family="monospace" font-size="9">ISO 800 • C-41</text>
        <text x="12" y="120" fill="#D35750" font-family="monospace" font-size="8">Red Optical Bloom</text>
      </g>
    </g>

    <!-- Intensity Slider -->
    <g transform="translate(32, 256)">
      <text x="0" y="16" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">EMULSION INTENSITY</text>
      <text x="632" y="16" fill="#FFB833" font-family="monospace" font-size="13" font-weight="800" text-anchor="end">100%</text>

      <!-- Slider Track -->
      <rect x="0" y="28" width="632" height="6" rx="3" fill="#252932" />
      <rect x="0" y="28" width="632" height="6" rx="3" fill="#FFB833" />
      <circle cx="632" cy="31" r="12" fill="#FFFFFF" stroke="#FFB833" stroke-width="3" />
    </g>

    <!-- Calibrated Test Scenes Chips -->
    <g transform="translate(32, 332)">
      <text x="0" y="14" fill="#8C93A0" font-family="sans-serif" font-size="12" font-weight="700">QUICK TEST SCENES</text>

      <!-- Chip 1: Coastal Dusk (ACTIVE) -->
      <g transform="translate(0, 26)">
        <rect x="0" y="0" width="136" height="36" rx="18" fill="#2D2315" stroke="#FFB833" stroke-width="1.5" />
        <circle cx="18" cy="18" r="5" fill="#FFB833" />
        <text x="32" y="22" fill="#FFB833" font-family="sans-serif" font-size="12" font-weight="700">Coastal Dusk</text>
      </g>

      <!-- Chip 2: Street Shadows -->
      <g transform="translate(148, 26)">
        <rect x="0" y="0" width="144" height="36" rx="18" fill="#1C1E23" stroke="#2E333D" stroke-width="1" />
        <text x="24" y="22" fill="#B0B5BD" font-family="sans-serif" font-size="12" font-weight="600">Street Shadows</text>
      </g>

      <!-- Chip 3: Vintage Cafe -->
      <g transform="translate(304, 26)">
        <rect x="0" y="0" width="134" height="36" rx="18" fill="#1C1E23" stroke="#2E333D" stroke-width="1" />
        <text x="24" y="22" fill="#B0B5BD" font-family="sans-serif" font-size="12" font-weight="600">Vintage Cafe</text>
      </g>
    </g>

    <!-- Bottom Action Row: Pick Custom Photo FAB -->
    <g transform="translate(32, 440)">
      <rect x="0" y="0" width="632" height="52" rx="14" fill="#1F232B" stroke="#353B47" stroke-width="1.5" />
      <text x="316" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">+ IMPORT CUSTOM PHOTO (PHOTO PICKER)</text>
    </g>
  </g>
</svg>
